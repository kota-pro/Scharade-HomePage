<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="UTF-8"><style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf7;color:#222;font:16px/1.7 sans-serif}header{padding:24px clamp(16px,4vw,48px);border-bottom:1px solid #222;background:white}h1{font:normal 30px/1.3 serif;margin:0 0 8px}h2{font:normal 23px/1.4 serif;margin:0 0 20px}h3{font-size:17px}main{max-width:1200px;margin:auto;padding:24px clamp(16px,4vw,48px)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,.link{padding:10px 16px;min-height:44px;border:1px solid #222;background:white;color:#222;font:inherit;cursor:pointer;border-radius:0}button:hover,button[aria-current=true]{background:#222;color:white}button:disabled{opacity:.5;cursor:wait}a{color:inherit}section{background:white;border:1px solid #ddd;padding:24px;margin-bottom:20px}label{display:block;margin-bottom:6px}input,select,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #888;border-radius:0;min-height:44px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:20px}.stack>*+*{margin-top:20px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{border-bottom:1px solid #ddd;text-align:left;padding:10px}th{background:#f2f0eb}td.num{text-align:right;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{border-left:2px solid #222;padding:12px}.card strong{display:block;font-size:24px}.muted{color:#666;font-size:14px}.notice{padding:12px 16px;background:#fff2da;border-left:3px solid #a66a00;margin:16px 0;white-space:pre-wrap}.error{background:#fff0ed;border-color:#a12020}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.request{border-top:1px solid #bbb;padding-top:20px;margin-top:20px;overflow-wrap:anywhere}.period{border-top:1px solid #aaa;padding:20px 0}#status{position:sticky;top:0;z-index:2}small{font-size:13px} [hidden]{display:none!important} @media(max-width:520px){section{padding:16px}main{padding:16px}nav button{font-size:14px;padding:8px}h1{font-size:27px}}
</style></head><body>
<header><h1>シャレード会計</h1><div class="muted">11月〜翌年10月 / 銀行・現金・立替精算</div><nav id="nav"></nav></header>
<main><p id="status" role="status" class="notice" hidden></p><div id="retry-box" hidden class="notice">前回の操作結果を確認できていません。<button id="retry-operation">前回の操作を再確認する</button></div><div id="issues"></div><div id="content">読み込み中…</div></main>
<script>
let data=null,tab='summary',busy=false,operationToken=crypto.randomUUID(),pendingOperation=null;
try{pendingOperation=JSON.parse(sessionStorage.getItem('accounting-pending')||'null');}catch{}
function rememberPending(value){pendingOperation=value;try{if(value)sessionStorage.setItem('accounting-pending',JSON.stringify(value));else sessionStorage.removeItem('accounting-pending');}catch{}document.getElementById('retry-box').hidden=!value;}
rememberPending(pendingOperation);document.getElementById('retry-operation').onclick=()=>{if(pendingOperation)run(pendingOperation);};
const labels={summary:'収支',transaction:'記録',requests:'申請の確認',advances:'立替・返金',checks:'残高確認',roster:'名簿',settings:'設定'};
const kinds={income:'収入',expense:'支出',transfer:'銀行・現金の移動',advance:'立替',openingAdvance:'開始日前の未返金立替',refund:'返金'};
const money=v=>v==null?'—':Number(v).toLocaleString('ja-JP')+'円';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function refundDetails(r) {
 if(!r||!r.refundMethod)return '<p class="muted">希望の返金方法：未指定（従来の申請）</p>';
 const details=r.refundMethod==='口座振込'?[['銀行名',r.bankName],['口座名義',r.bankAccountName],['店名',r.bankBranchName],['店番号',r.bankBranchCode],['口座番号',r.bankAccountNumber]]:r.refundMethod==='PayPay'?[['PayPay連絡用LINE名',r.refundLineName]]:[];
 return '<div class="refund-details"><p><strong>希望の返金方法：'+esc(r.refundMethod)+'</strong></p>'+details.map(([label,value])=>'<p>'+label+'：'+esc(value)+'</p>').join('')+'</div>';
}

function name(id){return data.members.find(p=>p.id===id)?.name||id;}
let fieldCounter=0;
function field(label,name,type='text',value='',extra=''){const id='f-'+(++fieldCounter);return `<div><label for="${id}">${label}</label><input id="${id}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
function select(label,key,options){const id='f-'+(++fieldCounter);return `<div><label for="${id}">${label}</label><select id="${id}" name="${key}">${options}</select></div>`;}
function people(selected=''){return '<option value="">人物を選択</option>'+data.members.map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${esc(p.name)} / ${esc(p.university)}${p.active?'':'（過去の名簿）'}</option>`).join('');}
function accounts(){return '<option value="bank">銀行</option><option value="cash">現金</option>';}
function table(headers,rows){return '<div class="table"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function message(text,error=false){const el=document.getElementById('status');el.hidden=!text;el.className='notice'+(error?' error':'');el.textContent=text;}
function run(input){
 if(busy)return;
 if(input.action!=='bootstrap'&&pendingOperation&&JSON.stringify(input)!==JSON.stringify(pendingOperation)){message('前回の操作を再確認してから、新しい操作を行ってください。',true);return;}
 const mutation=input.action!=='bootstrap';if(mutation)rememberPending(input);
 busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);message('処理しています…');
 google.script.run.withSuccessHandler(result=>{busy=false;if(!result.ok){if(mutation)rememberPending(null);message(result.message,true);document.querySelectorAll('button').forEach(b=>b.disabled=false);return;}if(mutation)rememberPending(null);data=result.data;operationToken=crypto.randomUUID();render();document.getElementById('retry-operation').disabled=false;message(result.warning||(input.action==='bootstrap'?'':'保存しました。'));}).withFailureHandler(()=>{busy=false;message('通信が途切れました。前回の操作を再確認してください。',true);document.querySelectorAll('button').forEach(b=>b.disabled=false);}).accountingAction(input);
}
function render(){
 document.getElementById('nav').innerHTML=Object.entries(labels).map(([key,label])=>`<button data-tab="${key}" aria-current="${tab===key}">${label}</button>`).join('');
 document.getElementById('issues').innerHTML=[data.issue,data.rosterError].filter(Boolean).map(m=>'<p class="notice">'+esc(m)+'</p>').join('');
 const el=document.getElementById('content');
 if(tab==='summary')el.innerHTML=`<section><h2>${data.settings.fiscalYear}年11月〜${data.settings.fiscalYear+1}年10月</h2><div class="cards">${data.summary? [['銀行残高',data.summary.bank],['現金残高',data.summary.cash],['未返金額',data.summary.outstanding]].map(([k,v])=>`<div class="card">${k}<strong>${money(v)}</strong></div>`).join(''):''}</div><div class="actions"><button data-action="refresh">再集計</button><a class="link" href="${esc(data.bookUrl)}" target="_blank" rel="noopener">会計台帳を開く</a></div></section><section><h2>月ごとの収支</h2>${table(['月','収入','支出','差額','銀行','現金','未返金'],data.months.map(m=>[m.month,money(m.income),money(m.expense),money(m.net),money(m.bank),money(m.cash),money(m.outstanding)]))}<p class="muted">支出は立替した月に含めます。返金や銀行・現金の移動は支出に重ねて計上しません。</p></section>`;
 if(tab==='transaction')el.innerHTML=`<section><h2>取引を記録する</h2><form id="transaction-form" class="stack"><div class="grid">${select('区分','type',Object.entries(kinds).map(([k,v])=>`<option value="${k}">${v}</option>`).join(''))}${field('日付','date','date',data.today,'required')}${field('金額（円）','amount','number','','min="1" step="1" required')}${field('項目名','description','text','','maxlength="200" required')}</div><div class="grid"><div data-for="income expense refund">${select('入出金する場所','account',accounts())}</div><div data-for="transfer">${select('移動元','from',accounts())}${select('移動先','to','<option value="cash">現金</option><option value="bank">銀行</option>')}</div><div data-for="advance openingAdvance refund">${select('立替者','memberId',people())}</div><div data-for="refund">${select('返金する立替','advanceId','')}</div></div><div><label>備考</label><textarea name="notes" maxlength="3000"></textarea></div><button type="submit">登録する</button></form></section><section><h2>記録の訂正</h2><p class="muted">取消理由を残してから、正しい内容を登録します。返金済みの立替を取り消す場合は、先に返金を取り消してください。</p>${data.events.filter(e=>!e.canceledAt).slice().reverse().slice(0,100).map(e=>`<div class="request">${esc(e.date)} / ${esc(kinds[e.type])} / ${esc(e.description)} / ${money(e.amount)} <button data-cancel="${esc(e.id)}">取消</button></div>`).join('')}</section>`;
 if(tab==='requests')el.innerHTML=`<section><h2>未承認の申請</h2>${data.requests.filter(r=>r.status==='未承認').map(r=>{const p=data.members.find(p=>p.siteUserIds.includes(r.websiteUserId));return `<article class="request"><h3>${esc(r.description)} / ${money(r.amount)}</h3><p>${esc(r.date)}　${esc(r.rosterName)}（サイト登録名：${esc(r.accountName)}）<br>${esc(r.university)} / LINE：${esc(r.lineName)}</p>${refundDetails(r)}<p>${esc(r.notes)}</p>${r.receiptUrl.startsWith('https:\x2f\x2f')?`<a href="${esc(r.receiptUrl)}" target="_blank" rel="noopener noreferrer">領収書を確認する</a>`:''}<form data-request="${esc(r.id)}" class="stack">${select('名簿の人物を確認','memberId',people(p?.id||''))}${field('確認メモ・却下理由','note','text','','maxlength="1000"')}<div class="actions"><button type="submit" name="decision" value="approve">承認する</button><button type="submit" name="decision" value="reject">却下する</button></div></form></article>`;}).join('')||'<p>未承認の申請はありません。</p>'}</section><section><h2>確認済み</h2>${table(['申請日','氏名','内容','金額','返金方法','結果'],data.requests.filter(r=>r.status!=='未承認').map(r=>[r.date,r.rosterName,r.description,money(r.amount),r.refundMethod||'未指定',r.status]))}</section>`;
 if(tab==='advances')el.innerHTML=`<section><h2>人物ごとの立替</h2>${table(['氏名','立替額','返金済み','未返金'],(data.summary?.people||[]).map(p=>[name(p.memberId),money(p.amount),money(p.repaid),money(p.outstanding)]))}</section><section><h2>未返金の明細</h2>${(data.summary?.advances||[]).filter(a=>a.outstanding>0).map(a=>`<div class="request">${esc(name(a.memberId))} / ${esc(a.date)} / ${esc(a.description)}<br>未返金 ${money(a.outstanding)}${refundDetails(data.requests.find(r=>r.transactionId===a.id))} <button data-refund="${esc(a.id)}">返金を登録</button></div>`).join('')||'<p>未返金の立替はありません。</p>'}</section>`;
 if(tab==='checks')el.innerHTML=`<section><h2>実際の残高を確認する</h2><p>確認日のすべての入出金を記録してから、その日が終わった時点の残高を入力してください。</p><form id="check-form" class="stack"><div class="grid">${field('確認日','date','date',data.today,'required')}${select('確認する場所','account',accounts())}${field('実際の残高（円）','actual','number','','step="1" required')}</div><button type="submit">残高を記録する</button></form></section><section><h2>照合結果</h2>${table(['日付','場所','帳簿残高','実残高','差額'],data.checks.map(c=>[c.date,c.account==='bank'?'銀行':'現金',money(c.expected),money(c.actual),money(c.difference)]))}<p class="muted">差額がある場合は、取引の記入漏れや金額を確認してください。</p></section>`;
 if(tab==='roster')el.innerHTML=`<section><h2>名簿の更新</h2><p>元の名簿は読み取り専用です。対応関係は会計側に保存します。</p><p class="muted">最終更新：${esc(data.rosterUpdatedAt||'未更新')}</p><button data-action="syncRoster">名簿を更新する</button></section><section><h2>人物の対応を確認</h2>${data.rosterPending.map(p=>`<article class="request"><h3>${esc(p.record.name)} / ${esc(p.record.university)}</h3><p>${esc(p.record.kana)} / LINE：${esc(p.record.lineName)}<br>${esc(p.reason)}</p><form data-roster-key="${esc(p.record.key)}" class="stack">${select('同じ人物、または新しい人物を選ぶ','memberId',people()+'<option value="new">別の人物として新規登録する</option>')}<button type="submit">対応を保存する</button></form></article>`).join('')||'<p>確認が必要な対応はありません。</p>'}</section><section><h2>名簿にない人物を追加</h2><p class="muted">本人を確認して会計用の人物として登録します。元の名簿への追加は行いません。</p><form id="person-form" class="stack"><div class="grid">${field('氏名','name','text','','required maxlength="100"')}${field('大学','university','text','','maxlength="100"')}${field('LINE名','lineName','text','','maxlength="100"')}</div><button type="submit">会計用の人物を登録</button></form></section><section><h2>登録されている人物</h2>${table(['氏名','大学','LINE名','名簿'],data.members.map(p=>[p.name,p.university,p.lineName,p.active?'現在':'過去']))}</section>`;
 if(tab==='settings')el.innerHTML=`<section><h2>会計の初期設定・表示年度</h2><form id="settings-form" class="stack"><div class="grid">${field('記録を始める日','startDate','date',data.settings.startDate,'required')}${field('開始時の銀行残高','bankOpening','number',data.settings.bankOpening,'step="1" required')}${field('開始時の現金残高','cashOpening','number',data.settings.cashOpening,'step="1" required')}${field('表示年度（11月が属する年）','fiscalYear','number',data.settings.fiscalYear,'required')}</div><div><label>引き継ぎメモ</label><textarea name="note">${esc(data.settings.note)}</textarea></div><button type="submit">設定を保存する</button></form><p class="muted">開始日前の未返金分は「記録 → 開始日前の未返金立替」で人物別に登録してください。</p></section><section><h2>半期ごとの名簿</h2><p>期間と参照先を登録します。切り替え後も過去の精算履歴は残ります。</p><form id="periods-form"><div id="period-rows">${data.periods.map(periodRow).join('')}</div><div class="actions"><button type="button" id="add-period">期間を追加</button><button type="submit">参照先を保存する</button></div></form></section>`;
 bind();
}
function periodRow(p){const rosterUrl=p.spreadsheetId?'https:\x2f\x2fdocs.google.com/spreadsheets/d/'+p.spreadsheetId+'/edit#gid='+p.sheetId:'';return `<div class="period grid">${field('開始日','start','date',p.start,'required')}${field('終了日','end','date',p.end,'required')}${field('名簿のURL','url','url',rosterUrl,'required')}${field('タブのシートID（URLのgid）','sheetId','number',p.sheetId??'','min="0" required')}${field('見出し行','headerRow','number',p.headerRow||1,'min="1" required')}<details><summary>列の対応（空欄は自動判定）</summary><p class="muted">A・B・C などの列記号を指定。存在しない項目は「-」。継続欄のない名簿は全員を対象にします。</p>${Object.entries({name:'氏名',kana:'ふりがな',lineName:'LINE名',gender:'性別',grade:'学年',university:'大学名',department:'学部',studentId:'学籍番号',continuation:'継続回答',timestamp:'回答日時'}).map(([k,label])=>field(label,'col_'+k,'text',p.columns?.[k]||'','maxlength="3"')).join('')}</details></div>`;}
function values(form){return Object.fromEntries(new FormData(form));}
function updateTransaction(){const f=document.getElementById('transaction-form');if(!f)return;const type=f.elements.type.value;f.querySelectorAll('[data-for]').forEach(el=>el.hidden=!el.dataset.for.split(' ').includes(type));const memberId=f.elements.memberId.value;f.elements.advanceId.innerHTML='<option value="">返金する立替を選ぶ</option>'+(data.summary?.advances||[]).filter(a=>a.outstanding>0&&a.memberId===memberId).map(a=>`<option value="${esc(a.id)}">${esc(a.date+' '+a.description)}（未返金 ${money(a.outstanding)}）</option>`).join('');if(type==='openingAdvance')f.elements.date.value=data.settings.startDate;}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;operationToken=crypto.randomUUID();message('');render();});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>run({action:b.dataset.action}));
 const tx=document.getElementById('transaction-form');if(tx){tx.elements.type.onchange=updateTransaction;tx.elements.memberId.onchange=updateTransaction;updateTransaction();tx.onsubmit=e=>{e.preventDefault();run({...values(tx),action:'transaction',token:operationToken});};}
 document.querySelectorAll('[data-request]').forEach(f=>f.onsubmit=e=>{e.preventDefault();run({...values(f),action:'review',requestId:f.dataset.request,decision:e.submitter.value});});
 document.querySelectorAll('[data-roster-key]').forEach(f=>f.onsubmit=e=>{e.preventDefault();run({...values(f),action:'resolveRoster',key:f.dataset.rosterKey});});
 document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const reason=prompt('取消理由を入力してください。');if(reason)run({action:'cancel',id:b.dataset.cancel,reason});});
 document.querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>{const a=data.summary.advances.find(a=>a.id===b.dataset.refund);tab='transaction';render();const f=document.getElementById('transaction-form');f.elements.type.value='refund';f.elements.memberId.value=a.memberId;updateTransaction();f.elements.advanceId.value=a.id;f.elements.amount.value=a.outstanding;f.elements.description.value=a.description+'の返金';});
 const checks=document.getElementById('check-form');if(checks)checks.onsubmit=e=>{e.preventDefault();run({...values(checks),action:'check',token:operationToken});};
 const person=document.getElementById('person-form');if(person)person.onsubmit=e=>{e.preventDefault();run({...values(person),action:'addPerson',token:operationToken});};
 const settings=document.getElementById('settings-form');if(settings)settings.onsubmit=e=>{e.preventDefault();run({...values(settings),action:'settings'});};
 const periods=document.getElementById('periods-form');if(periods){document.getElementById('add-period').onclick=()=>{document.getElementById('period-rows').insertAdjacentHTML('beforeend',periodRow({start:'',end:'',sheetId:'',headerRow:1}));};periods.addEventListener('change',e=>{if(e.target.name==='url'){const m=e.target.value.match(/[?#&]gid=(\d+)/);if(m)e.target.closest('.period').querySelector('[name=sheetId]').value=m[1];}});periods.onsubmit=e=>{e.preventDefault();run({action:'periods',periods:[...periods.querySelectorAll('.period')].map(row=>Object.fromEntries([...row.querySelectorAll('input')].map(el=>[el.name,el.value])))});};}
}
run({action:'bootstrap'});
</script></body></html>
