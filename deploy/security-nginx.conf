# Included in Nginx's http context via /etc/nginx/conf.d/*.conf.
log_format scharade_safe '$remote_addr - $time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=scharade_general:10m rate=20r/s;
map $uri $scharade_auth_key {
    default "";
    ~^/api/auth/(login|signup|mfa|password-reset/) $binary_remote_addr;
    /api/contact $binary_remote_addr;
}
map $uri $scharade_upload_key {
    default "";
    ~^/api/.*/upload$ $binary_remote_addr;
}
map $uri $scharade_upload_group {
    default "";
    ~^/api/.*/upload$ "uploads";
}
map $scharade_auth_key $scharade_auth_group {
    "" "";
    default "authentication";
}
limit_req_zone $scharade_auth_key zone=scharade_auth:10m rate=5r/m;
limit_req_zone $scharade_auth_group zone=scharade_auth_global:10m rate=4r/s;
limit_req_zone $scharade_upload_key zone=scharade_upload:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=scharade_connections:10m;
limit_conn_zone $scharade_upload_group zone=scharade_upload_connections:10m;
map "$uri:$arg_token:$arg_sig" $scharade_referrer_policy {
    default "no-referrer";
    "/About_us::" "strict-origin";
    "/About_us/::" "strict-origin";
}

server {
    listen 443 ssl;
    server_name scharade.jp www.scharade.jp;
    if ($host !~ ^(scharade\.jp|www\.scharade\.jp)$) { return 444; }
    ssl_certificate /etc/letsencrypt/live/scharade.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scharade.jp/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 21m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=scharade_general burst=40 nodelay;
    limit_req zone=scharade_auth burst=10 nodelay;
    limit_req zone=scharade_auth_global burst=10 nodelay;
    limit_req zone=scharade_upload burst=4 nodelay;
    limit_conn scharade_connections 16;
    limit_conn scharade_upload_connections 8;
    access_log /var/log/nginx/scharade-access.log scharade_safe;
    # Nginx errors may contain the original query string; omit per-request error logs.
    error_log /var/log/nginx/scharade-error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Only the Maps page needs the origin; sensitive pages send no referrer.
    add_header Referrer-Policy $scharade_referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only the two app association documents may pass the hidden-path rule.
    location ~ ^/\.well-known/(apple-app-site-association|assetlinks\.json)$ {
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ~ /\. { return 404; }
    location ~* ^/(src|scripts|tests|gas|docs|deploy|node_modules|dist/server)(/|$) { return 404; }
    location ~* ^/(package(-lock)?\.json|yarn\.lock|astro\.config\..*|ecosystem\.config\..*)$ { return 404; }
    location / {
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name scharade.jp www.scharade.jp;
    server_tokens off;
    access_log /var/log/nginx/scharade-access.log scharade_safe;
    error_log /var/log/nginx/scharade-error.log crit;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    return 301 https://scharade.jp$request_uri;
}
